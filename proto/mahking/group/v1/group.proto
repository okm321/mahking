syntax = "proto3";

package mahking.group.v1;

service GroupService {
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse);
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
}

message Group {
  int64 id = 1;
  string uid = 2;
  string name = 3;
}

enum MahjongType {
  MAHJONG_TYPE_UNSPECIFIED = 0;
  MAHJONG_TYPE_THREE = 1; // 三麻
  MAHJONG_TYPE_FOUR = 2; // 四麻
}

enum FractionalCalculation {
  FRACTIONAL_CALCULATION_UNSPECIFIED = 0;
  FRACTIONAL_CALCULATION_DECIMAL = 1;        // 小数点有効
  FRACTIONAL_CALCULATION_ROUND_DOWN = 2;     // 切り捨て
  FRACTIONAL_CALCULATION_ROUND_UP = 3;       // 切り上げ
  FRACTIONAL_CALCULATION_ROUND_NEAREST = 4;  // 四捨五入
  FRACTIONAL_CALCULATION_ROUND_FIVE = 5;     // 五捨六入
}

enum FractionalRecipient {
  FRACTIONAL_RECIPIENT_UNSPECIFIED = 0;
  FRACTIONAL_RECIPIENT_FIRST = 1;  // 1位の人
  FRACTIONAL_RECIPIENT_LAST = 2;   // 最下位の人
}

message Rules {
  MahjongType mahjong_type = 1;
  int32 initial_points = 2;
  int32 return_points = 3;
  int32 ranking_points_first = 4;
  int32 ranking_points_second = 5;
  int32 ranking_points_third = 6;
  optional int32 ranking_points_four = 7;
  FractionalCalculation fractional_calculation = 8;
  bool use_bust = 9;
  optional int32 bust_point = 10;
  bool use_chip = 11;
  optional int32 chip_point = 12;
}

message GetGroupRequest {
  string uid = 1;
}

message GetGroupResponse {
  Group group = 1;
}

message ListGroupsResponse {
  repeated Group groups = 1;
}

message CreateGroupRequest {
  string name = 1;
  repeated string member_names = 2;
  Rules rules = 3;
}

message CreateGroupResponse {
  Group group = 1;
}
