version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/okm321/mahking/go/internal/presentation/rpc/gen
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../go/internal/presentation/rpc/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: ../go/internal/presentation/rpc/gen
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es
    out: ../web/app/gen
